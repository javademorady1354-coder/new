<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>تعقیب چند نقطه</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#243650,#101827 70%);color:#f5f8fc;font-family:Tahoma,Arial,sans-serif;min-height:100vh;padding:12px}main{max-width:620px;margin:auto}.head{text-align:center}.head h1{font-size:24px;margin:7px}.head p{font-size:12px;color:#a9b8ca;line-height:1.8}.panel{background:#1c293b;border:1px solid #35465d;border-radius:17px;padding:13px;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#111c2c;border-radius:12px;padding:9px;text-align:center}.stat small{display:block;color:#a9b8ca;font-size:11px}.stat b{font-size:20px}button{font:inherit;border:0;border-radius:11px;padding:11px;background:#30445f;color:#fff;cursor:pointer}button.primary{background:#65d6ad;color:#10251e;font-weight:bold}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.msg{text-align:center;min-height:25px;color:#ffd166;font-size:13px;margin-top:10px}.note{font-size:11px;line-height:1.8;color:#a9b8ca;text-align:center}.hidden{display:none!important}
</style></head><body><main><header class="head"><div style="font-size:32px">🟣</div><h1>تعقیب چند نقطه</h1><p>نقطه هدف را میان چند نقطه متحرک دنبال کن.</p></header><section class="panel stats"><div class="stat"><small>زمان</small><b id="time">30</b></div><div class="stat"><small>امتیاز</small><b id="score">0</b></div><div class="stat"><small>رکورد</small><b id="best">0</b></div></section><section class="panel"><div class="note">نقطه هدف را به خاطر بسپار و در میان نقطه‌های متحرک دنبال کن. پس از توقف حرکت، محل نقطه هدف را انتخاب کن.</div><div id="target" style="text-align:center;font-size:20px;padding:12px;color:#ffd166">هدف: نقطه زرد</div><div id="arena" style="height:310px;position:relative;overflow:hidden;border-radius:15px;background:#101c2d;border:1px solid #405675;margin:8px 0"></div><div class="msg" id="msg">برای شروع بازی را بزن.</div><div class="controls"><button class="primary" id="start">شروع بازی</button><button id="reset">پاک‌کردن رکورد</button></div></section></main><script>(()=>{const $=id=>document.getElementById(id),arena=$('arena');let score=0,left=30,timer=null,active=false,balls=[],raf=0,phase='';const k='multi-track-best';function best(){$('best').textContent=localStorage.getItem(k)||0}function stop(){cancelAnimationFrame(raf)}function makeRound(){arena.innerHTML='';balls=[];let colors=['#ffd43b','#f87171','#60a5fa','#4ade80','#c084fc'];for(let i=0;i<5;i++){let el=document.createElement('button');el.style.cssText='position:absolute;width:34px;height:34px;padding:0;border-radius:50%;background:'+colors[i]+';border:2px solid white;left:0;top:0';arena.appendChild(el);let b={el,x:25+Math.random()*(arena.clientWidth-60),y:25+Math.random()*(arena.clientHeight-60),vx:(Math.random()*2+1)*(Math.random()<.5?-1:1),vy:(Math.random()*2+1)*(Math.random()<.5?-1:1),target:i===0};balls.push(b)}$('msg').textContent='دنبال نقطه زرد بمان...';phase='track';let start=performance.now();function move(now){if(!active||phase!=='track')return;let w=arena.clientWidth,h=arena.clientHeight;balls.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<0||b.x>w-34)b.vx*=-1;if(b.y<0||b.y>h-34)b.vy*=-1;b.el.style.left=b.x+'px';b.el.style.top=b.y+'px'});if(now-start>4500){phase='choose';$('msg').textContent='حرکت متوقف شد؛ نقطه هدف را انتخاب کن.';balls.forEach((b,i)=>{b.el.style.background='#e6edf7';b.el.style.borderColor='#8192a8';b.el.onclick=()=>{if(!active||phase!=='choose')return;if(b.target){score++;$('msg').textContent='آفرین، درست پیدا کردی!'}else{$('msg').textContent='این نقطه نبود؛ دور بعدی را امتحان کن.'} $('score').textContent=score;setTimeout(()=>{if(active)makeRound()},650)}});return}raf=requestAnimationFrame(move)}raf=requestAnimationFrame(move)}function end(){active=false;stop();clearInterval(timer);$('msg').textContent='پایان بازی! امتیاز: '+score;let old=+(localStorage.getItem(k)||0);if(score>old)localStorage.setItem(k,score);best()}$('start').onclick=()=>{clearInterval(timer);stop();score=0;left=30;active=true;$('score').textContent=0;$('time').textContent=left;makeRound();timer=setInterval(()=>{left--;$('time').textContent=left;if(left<=0)end()},1000)};$('reset').onclick=()=>{localStorage.removeItem(k);best();$('msg').textContent='رکورد پاک شد.'};best()})();</script></body></html>
