<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>باشگاه بازی‌های ذهنی</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#243650,#101827 70%);color:#f5f8fc;font-family:Tahoma,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}header{text-align:center;padding:18px 12px 12px}h1{font-size:25px;margin:3px 0 7px}.sub{font-size:13px;color:#a9b8ca}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 10px 10px;max-width:760px;width:100%;margin:auto}nav button{border:1px solid #425873;border-radius:13px;background:#24364e;color:#eaf2fc;padding:12px 5px;font:bold 12px Tahoma;min-height:55px}nav button.active{background:#65d6ad;color:#10251e;border-color:#65d6ad}main{flex:1;min-height:0;padding:0 8px 8px;display:flex;flex-direction:column}iframe{width:100%;height:100%;min-height:0;flex:1;border:1px solid #344b66;border-radius:16px;background:#101827}footer{text-align:center;color:#8192a8;font-size:10px;padding:5px 0 9px}</style></head><body><header><h1>🎮 باشگاه بازی‌های ذهنی</h1><div class="sub">سه تمرین آفلاین برای تمرکز، محاسبه و توجه دیداری</div></header><nav><button class="active" data-file="challenge-mind.html">🧠 چالش ذهن</button><button data-file="number-sequence.html">🔢 ترتیب اعداد</button><button data-file="eagle-eye.html">🦅 چشم عقاب</button></nav><main><iframe id="game" src="challenge-mind.html" title="بازی انتخاب‌شده"></iframe></main><footer>همه بازی‌ها بدون اینترنت اجرا می‌شوند.</footer><script>const frame=document.getElementById('game'),buttons=[...document.querySelectorAll('nav button')];buttons.forEach(b=>b.addEventListener('click',()=>{buttons.forEach(x=>x.classList.remove('active'));b.classList.add('active');frame.src=b.dataset.file;}));</script></body></html>
