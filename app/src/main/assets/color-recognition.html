<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>تشخیص رنگ‌ها</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#243650,#101827 70%);color:#f5f8fc;font-family:Tahoma,Arial,sans-serif;min-height:100vh;padding:12px}main{max-width:620px;margin:auto}.head{text-align:center}.head h1{font-size:24px;margin:7px}.head p{font-size:12px;color:#a9b8ca;line-height:1.8}.panel{background:#1c293b;border:1px solid #35465d;border-radius:17px;padding:13px;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#111c2c;border-radius:12px;padding:9px;text-align:center}.stat small{display:block;color:#a9b8ca;font-size:11px}.stat b{font-size:20px}button{font:inherit;border:0;border-radius:11px;padding:11px;background:#30445f;color:#fff;cursor:pointer}button.primary{background:#65d6ad;color:#10251e;font-weight:bold}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.msg{text-align:center;min-height:25px;color:#ffd166;font-size:13px;margin-top:10px}.note{font-size:11px;line-height:1.8;color:#a9b8ca;text-align:center}.hidden{display:none!important}
</style><style>.back-menu{position:fixed;top:7px;right:8px;z-index:9999;text-decoration:none;background:#30445f;color:#fff;border:1px solid #526985;border-radius:10px;padding:8px 11px;font:12px Tahoma;box-shadow:0 3px 12px #0005}header,.head{padding-top:38px!important}</style><style>
html,body{height:100%;height:100dvh;overflow:hidden}
body{min-height:0;padding:5px 8px}
main{height:100%;max-height:100%;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.head{padding-top:36px!important;flex:0 0 auto}
.head h1{font-size:21px;margin:3px}.head p{font-size:11px;line-height:1.45;margin:4px auto 7px}
.panel{margin:5px 0;padding:9px;border-radius:14px;min-height:0}
.stats{flex:0 0 auto;gap:5px}.stat{padding:6px}.stat small{font-size:10px}.stat b{font-size:17px}
.note{font-size:10px;line-height:1.5}
button{padding:9px}
#board .cell{height:clamp(31px,6.3vh,48px);aspect-ratio:auto}
#arena{height:min(48vh,310px)!important;min-height:155px!important;flex:1}
#choices button{height:clamp(55px,11vh,85px)!important}
#board{gap:5px!important}
.controls{margin-top:7px}
footer{font-size:9px;margin-top:4px}
</style></head><body><a class="back-menu" href="index.html">‹ منوی بازی‌ها</a><main><header class="head"><div style="font-size:32px">🎨</div><h1>تشخیص رنگ‌ها</h1><p>سرعت تشخیص و تمایز رنگ‌ها را تمرین کن.</p></header><section class="panel stats"><div class="stat"><small>زمان</small><b id="time">30</b></div><div class="stat"><small>امتیاز</small><b id="score">0</b></div><div class="stat"><small>رکورد</small><b id="best">0</b></div></section><section class="panel"><div class="note">نام رنگ را بخوان و خانه‌ای را که همان رنگ را دارد انتخاب کن.</div><div id="question" style="font-size:25px;text-align:center;padding:22px 5px;font-weight:bold">آماده‌ای؟</div><div id="choices" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"></div><div class="msg" id="msg">برای شروع بازی را بزن.</div><div class="controls"><button class="primary" id="start">شروع بازی</button><button id="reset">پاک‌کردن رکورد</button></div></section></main><script>(()=>{const $=id=>document.getElementById(id),colors=[{n:'قرمز',c:'#ef4444'},{n:'آبی',c:'#3b82f6'},{n:'سبز',c:'#22c55e'},{n:'زرد',c:'#facc15'},{n:'بنفش',c:'#a855f7'},{n:'نارنجی',c:'#f97316'}];let score=0,left=30,timer=null,active=false,target=null;const k='color-game-best';function best(){$('best').textContent=localStorage.getItem(k)||0}function round(){target=colors[Math.floor(Math.random()*colors.length)];$('question').textContent='رنگ '+target.n+' را پیدا کن';let opts=[target,...colors.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);$('choices').innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.style.cssText='height:92px;border:3px solid #ffffff55;background:'+o.c+';font-size:0';b.setAttribute('aria-label','انتخاب رنگ');b.onclick=()=>{if(!active)return;if(o===target){score++;$('score').textContent=score;$('msg').textContent='درست بود!';round()}else{$('msg').textContent='این رنگ درست نیست؛ دوباره تلاش کن.'}};$('choices').appendChild(b)})}function end(){active=false;clearInterval(timer);$('msg').textContent='پایان بازی! امتیاز: '+score;let old=+(localStorage.getItem(k)||0);if(score>old)localStorage.setItem(k,score);best()}$('start').onclick=()=>{clearInterval(timer);score=0;left=30;active=true;$('score').textContent=0;$('time').textContent=left;$('msg').textContent='شروع شد!';round();timer=setInterval(()=>{left--;$('time').textContent=left;if(left<=0)end()},1000)};$('reset').onclick=()=>{localStorage.removeItem(k);best();$('msg').textContent='رکورد پاک شد.'};best()})();</script></body></html>
