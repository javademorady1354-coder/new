<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>شکل متفاوت</title><style>

</style><style id="bright-fantasy-theme">

</head><body><a class="back-menu" href="index.html">‹ منوی بازی‌ها</a><main><header class="head"><div style="font-size:32px">🔷</div><h1>شکل متفاوت</h1><p>شکل متفاوت را در میان شکل‌های مشابه پیدا کن.</p></header><section class="panel stats"><div class="stat"><small>زمان</small><b id="time">30</b></div><div class="stat"><small>امتیاز</small><b id="score">0</b></div><div class="stat"><small>رکورد</small><b id="best">0</b></div></section><section class="panel"><div class="note">شکلی را پیدا کن که با بقیه فرق دارد و روی آن بزن.</div><div id="board" style="display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px"></div><div class="msg" id="msg">برای شروع بازی را بزن.</div><div class="controls"><button class="primary" id="start">شروع بازی</button><button id="reset">پاک‌کردن رکورد</button></div></section></main><script>(()=>{const $=id=>document.getElementById(id),board=$('board');let score=0,left=30,timer=null,active=false;const k='odd-shape-best';const shapes=['●','■','▲','◆','★','⬟'];function best(){$('best').textContent=localStorage.getItem(k)||0}function round(){let base=shapes[Math.floor(Math.random()*shapes.length)],odd=shapes.filter(x=>x!==base)[Math.floor(Math.random()*5)],pos=Math.floor(Math.random()*16);board.innerHTML='';for(let i=0;i<16;i++){let b=document.createElement('button');b.textContent=i===pos?odd:base;b.style.cssText='height:62px;padding:0;background:#e8f0fb;color:#14243a;font-size:32px;font-weight:bold';b.onclick=()=>{if(!active)return;if(i===pos){score++;$('score').textContent=score;$('msg').textContent='درست پیدا کردی!';round()}else{$('msg').textContent='این شکل متفاوت نیست؛ دوباره نگاه کن.'}};board.appendChild(b)}}function end(){active=false;clearInterval(timer);$('msg').textContent='پایان بازی! امتیاز: '+score;let old=+(localStorage.getItem(k)||0);if(score>old)localStorage.setItem(k,score);best()}$('start').onclick=()=>{clearInterval(timer);score=0;left=30;active=true;$('score').textContent=0;$('time').textContent=left;$('msg').textContent='با دقت نگاه کن!';round();timer=setInterval(()=>{left--;$('time').textContent=left;if(left<=0)end()},1000)};$('reset').onclick=()=>{localStorage.removeItem(k);best();$('msg').textContent='رکورد پاک شد.'};best()})();</script></body></html>
