name: Build Color Word Challenge APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'color-challenge/**'
      - '.github/workflows/build-color-challenge-apk.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build standalone debug APK
        working-directory: color-challenge/android
        run: gradle assembleDebug
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: color-word-challenge-standalone-apk
          path: color-challenge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
