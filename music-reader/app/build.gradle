plugins { id 'com.android.application' }

android {
    namespace 'ir.esra.musicreader'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.esra.musicreader'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
